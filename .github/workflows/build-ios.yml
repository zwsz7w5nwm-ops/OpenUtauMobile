name: Build iOS IPA

run-name: "iOS Build #${{ github.run_number }} · ${{ github.ref_name }}"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    name: Build iOS (Debug)
    runs-on: macos-15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install MAUI workloads
        run: dotnet workload install maui

      - name: Restore workloads
        run: dotnet workload restore

      - name: Restore dependencies
        run: dotnet restore OpenUtauMobile/OpenUtauMobile.csproj

      - name: Publish iOS (arm64, Debug)
        env:
          TreatWarningsAsErrors: 'false'
        run: dotnet publish OpenUtauMobile/OpenUtauMobile.csproj -f net9.0-ios -c Debug -r ios-arm64 -p:RunAnalyzers=false -p:TreatWarningsAsErrors=false -p:CodeAnalysisTreatWarningsAsErrors=false -p:NoWarn=8600-8699;CA1400-CA9999;NU1504;NETSDK1202

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: OpenUtauMobile-ios-ipa
          path: "**/*.ipa"
