name: Build iOS IPA

run-name: "iOS Build #${{ github.run_number }} · ${{ github.ref_name }}"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    name: Build iOS (Debug)
    runs-on: macos-15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # 【关键修复】安装完整的 MAUI 工作负载（包含 android 和 ios），解决 NETSDK1147 报错
      - name: Install MAUI workloads
        run: dotnet workload install maui

      # 【关键修复】自动修复项目缺失的工作负载依赖
      - name: Restore workloads
        run: dotnet workload restore

      - name: Restore dependencies
        run: dotnet restore OpenUtauMobile/OpenUtauMobile.csproj

      - name: Publish iOS (arm64, Debug)
        run: dotnet publish OpenUtauMobile/OpenUtauMobile.csproj -f net9.0-ios -c Debug -r ios-arm64

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: OpenUtauMobile-ios-ipa
          path: "**/*.ipa"
